<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード生成【ランダム文字列】</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <h1>ランダム文字列生成</h1>

    <main class="container">
        <form id="form" autocomplete="off">
            <table>
                <tr>
                    <td><strong>文字数の選択:</strong></td>
                    <td>
                        <label><input type="radio" name="length" value="8"> 8文字</label><br>
                        <label><input type="radio" name="length" value="16"> 16文字</label><br>
                        <label><input type="radio" name="length" value="32" checked> 32文字</label><br>
                        <label><input type="radio" name="length" value="custom"> カスタム</label><br>
                        <input
                            type="number"
                            id="customLength"
                            min="8"
                            max="256"
                            step="1"
                            inputmode="numeric"
                            placeholder="8〜256"
                            aria-describedby="status"
                            hidden
                        >
                    </td>
                </tr>
                <tr>
                    <td><strong>文字種の選択:</strong></td>
                    <td>
                        <label><input type="radio" name="charType" value="alphabet"> アルファベットのみ</label><br>
                        <label><input type="radio" name="charType" value="alphanumeric"> アルファベットと数字</label><br>
                        <label><input type="radio" name="charType" value="alphanumeric-symbols" checked> アルファベット・数字・記号</label>
                    </td>
                </tr>
            </table>

            <button type="button" id="generateButton">生成</button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div class="result" id="result"></div>
    </main>
</body>
</html>
